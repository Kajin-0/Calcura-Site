<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Calcura is a free calculus practice app with guided solutions, generated integral practice, graphs, references, and private learning progress."
    />
    <meta name="theme-color" content="#f7f9fc" />
    <meta property="og:title" content="Calcura — Learn integrals by doing them" />
    <meta
      property="og:description"
      content="Free calculus practice for students. Classroom visibility and analytics for educators."
    />
    <title>Calcura — Learn integrals by doing them</title>
    <style>
      /* Keep the product sections direct: no decorative sequence numbering. */
      .feature-number,
      .classroom-flow > div > span:first-child {
        display: none !important;
      }

      .classroom-flow strong {
        margin-top: 0 !important;
      }

      /* Keep the header focused on the two actions that matter. */
      .site-header nav {
        display: none !important;
      }

      .site-header .nav-actions {
        margin-left: auto;
        gap: 10px;
      }

      .site-header .nav-actions .button {
        white-space: nowrap;
      }

      /* Restore the earlier compact pricing presentation only. */
      .pricing-section {
        padding-top: 100px !important;
        padding-bottom: 100px !important;
        border-bottom: 1px solid var(--line);
        background: var(--surface-2) !important;
      }

      .pricing-grid {
        gap: 12px !important;
        margin-top: 45px !important;
      }

      .price-card {
        min-height: 270px !important;
        padding: 24px !important;
        border-radius: 16px !important;
      }

      .price-card.featured {
        border-color: #8fb6e9 !important;
        box-shadow: 0 15px 36px rgba(39, 96, 171, 0.1) !important;
      }

      .price-badge,
      .price-card > p,
      .price-features {
        display: none !important;
      }

      .price {
        margin-top: 27px !important;
      }

      .price strong {
        font-size: 31px !important;
      }

      .price-card .button {
        width: auto !important;
        min-height: 0 !important;
        justify-content: flex-start !important;
        margin-top: auto !important;
        padding: 0 !important;
        border: 0 !important;
        background: transparent !important;
        color: #324c6d !important;
        box-shadow: none !important;
        font-size: 11px !important;
      }

      .pricing-footnote {
        margin-top: 21px !important;
        font-size: 10px !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      const cleanProductPage = () => {
        document
          .querySelectorAll('a[href="https://github.com/Kajin-0/Calcura"]')
          .forEach((link) => link.remove());

        const previewNames = ['M. Chen', 'J. Rivera', 'A. Patel', 'S. Brooks'];
        document
          .querySelectorAll('.student-table-row span:first-child')
          .forEach((cell, index) => {
            if (/^Student\s+\d+$/i.test(cell.textContent.trim())) {
              cell.textContent = previewNames[index] ?? 'Student';
            }
          });

        const navActions = document.querySelector('.site-header .nav-actions');
        if (navActions && navActions.dataset.simplified !== 'true') {
          navActions.innerHTML = `
            <a class="button button-secondary button-small" href="#download">Download Calcura</a>
            <a class="button button-small" href="#pilot">Instructor Sign In</a>
          `;
          navActions.dataset.simplified = 'true';
        }
      };

      new MutationObserver(cleanProductPage).observe(document.body, {
        childList: true,
        subtree: true,
      });

      cleanProductPage();
    </script>
  </body>
</html>
