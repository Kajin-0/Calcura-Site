<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Calcura is a free calculus practice app with guided solutions, generated integral practice, graphs, references, and private learning progress."
    />
    <meta name="theme-color" content="#f7f9fc" />
    <meta property="og:title" content="Calcura — Learn integrals by doing them" />
    <meta
      property="og:description"
      content="Free calculus practice for students. Classroom visibility and analytics for educators."
    />
    <title>Calcura — Learn integrals by doing them</title>
    <style>
      /* Keep the product sections direct: no decorative sequence numbering. */
      .feature-number,
      .classroom-flow > div > span:first-child {
        display: none !important;
      }

      .classroom-flow strong {
        margin-top: 0 !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      const cleanProductPage = () => {
        document
          .querySelectorAll('a[href="https://github.com/Kajin-0/Calcura"]')
          .forEach((link) => link.remove());

        const previewNames = ['M. Chen', 'J. Rivera', 'A. Patel', 'S. Brooks'];
        document
          .querySelectorAll('.student-table-row span:first-child')
          .forEach((cell, index) => {
            if (/^Student\s+\d+$/i.test(cell.textContent.trim())) {
              cell.textContent = previewNames[index] ?? 'Student';
            }
          });
      };

      new MutationObserver(cleanProductPage).observe(document.body, {
        childList: true,
        subtree: true,
      });

      cleanProductPage();
    </script>
  </body>
</html>
