<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Calcura is a free calculus practice app with guided solutions, generated integral practice, graphs, references, and private learning progress."
    />
    <meta name="theme-color" content="#f7f9fc" />
    <meta property="og:title" content="Calcura — Learn integrals by doing them" />
    <meta
      property="og:description"
      content="Free calculus practice for students. Classroom visibility and analytics for educators."
    />
    <title>Calcura — Learn integrals by doing them</title>
    <style>
      /* Keep the product sections direct: no decorative sequence numbering. */
      .feature-number,
      .classroom-flow > div > span:first-child {
        display: none !important;
      }

      .classroom-flow strong {
        margin-top: 0 !important;
      }

      /* Keep the header focused on the two actions that matter. */
      .site-header nav {
        display: none !important;
      }

      .site-header .nav-actions {
        margin-left: auto;
        gap: 10px;
      }

      .site-header .nav-actions .button {
        white-space: nowrap;
      }

      /* Compact pricing layout from the earlier site version. */
      .pricing-compact {
        padding: 100px 0;
        border-top: 1px solid var(--line);
        border-bottom: 1px solid var(--line);
        background: var(--surface-2);
      }

      .pricing-compact .pricing-head {
        max-width: 750px;
        margin: 0 auto;
        text-align: center;
      }

      .pricing-compact .pricing-head h2 {
        margin: 10px 0 0;
        font-size: clamp(37px, 4.3vw, 58px);
        line-height: 1.06;
        font-weight: 800;
        letter-spacing: -0.045em;
      }

      .pricing-compact .plans {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
        margin-top: 45px;
      }

      .pricing-compact .plan {
        min-height: 270px;
        display: flex;
        flex-direction: column;
        padding: 24px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: #fff;
      }

      .pricing-compact .plan-featured {
        border-color: #8fb6e9;
        box-shadow: 0 15px 36px rgba(39, 96, 171, 0.1);
      }

      .pricing-compact .plan-name,
      .pricing-compact .plan-seats {
        display: block;
      }

      .pricing-compact .plan-name {
        color: #71839a;
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .pricing-compact .plan-seats {
        margin-top: 7px;
        font-size: 16px;
      }

      .pricing-compact .plan-price {
        display: flex;
        align-items: baseline;
        gap: 4px;
        margin-top: 27px;
      }

      .pricing-compact .plan-price strong {
        font-size: 31px;
        letter-spacing: -0.045em;
      }

      .pricing-compact .plan-price span {
        color: #8090a3;
        font-size: 10px;
      }

      .pricing-compact .plan a {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        margin-top: auto;
        color: #324c6d;
        font-size: 11px;
        font-weight: 700;
      }

      .pricing-compact .plan a svg {
        width: 14px;
        height: 14px;
      }

      .pricing-compact .pricing-note {
        margin: 21px 0 0;
        color: #8291a4;
        font-size: 10px;
        text-align: center;
      }

      @media (max-width: 980px) {
        .pricing-compact .plans {
          grid-template-columns: repeat(2, 1fr);
        }
      }

      @media (max-width: 600px) {
        .pricing-compact .plans {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      const arrowSvg = `
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M4 10h11M11 6l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path>
        </svg>
      `;

      const cleanProductPage = () => {
        document
          .querySelectorAll('a[href="https://github.com/Kajin-0/Calcura"]')
          .forEach((link) => link.remove());

        const previewNames = ['M. Chen', 'J. Rivera', 'A. Patel', 'S. Brooks'];
        document
          .querySelectorAll('.student-table-row span:first-child')
          .forEach((cell, index) => {
            if (/^Student\s+\d+$/i.test(cell.textContent.trim())) {
              cell.textContent = previewNames[index] ?? 'Student';
            }
          });

        const navActions = document.querySelector('.site-header .nav-actions');
        if (navActions && navActions.dataset.simplified !== 'true') {
          navActions.innerHTML = `
            <a class="button button-secondary button-small" href="#download">Download Calcura</a>
            <a class="button button-small" href="#pilot">Instructor Sign In</a>
          `;
          navActions.dataset.simplified = 'true';
        }

        const pricing = document.querySelector('#pricing');
        if (pricing && pricing.dataset.compact !== 'true') {
          pricing.className = 'pricing-compact';
          pricing.innerHTML = `
            <div class="shell">
              <div class="pricing-head">
                <div class="eyebrow">PILOT PRICING</div>
                <h2>Simple seat plans.</h2>
              </div>

              <div class="plans">
                <article class="plan">
                  <div>
                    <span class="plan-name">Tutor</span>
                    <b class="plan-seats">10 seats</b>
                  </div>
                  <div class="plan-price"><strong>$39</strong><span>/mo</span></div>
                  <a href="#pilot">Pilot interest ${arrowSvg}</a>
                </article>

                <article class="plan plan-featured">
                  <div>
                    <span class="plan-name">Small Team</span>
                    <b class="plan-seats">30 seats</b>
                  </div>
                  <div class="plan-price"><strong>$79</strong><span>/mo</span></div>
                  <a href="#pilot">Pilot interest ${arrowSvg}</a>
                </article>

                <article class="plan">
                  <div>
                    <span class="plan-name">Classroom</span>
                    <b class="plan-seats">100 seats</b>
                  </div>
                  <div class="plan-price"><strong>$199</strong><span>/mo</span></div>
                  <a href="#pilot">Pilot interest ${arrowSvg}</a>
                </article>

                <article class="plan">
                  <div>
                    <span class="plan-name">Institution</span>
                    <b class="plan-seats">300–1,000+</b>
                  </div>
                  <div class="plan-price"><strong>Custom</strong></div>
                  <a href="#pilot">Pilot interest ${arrowSvg}</a>
                </article>
              </div>

              <p class="pricing-note">Need 300, 500, 1,000, or unlimited seats? Quote the deployment.</p>
            </div>
          `;
          pricing.dataset.compact = 'true';
        }
      };

      new MutationObserver(cleanProductPage).observe(document.body, {
        childList: true,
        subtree: true,
      });

      cleanProductPage();
    </script>
  </body>
</html>
